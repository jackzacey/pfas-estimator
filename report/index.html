<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="description" content="Create a printable water-system report to share at a clinic visit, with historical chemical results, sampling dates, and a QR code back to the provider." />
  <title>Clinic report | PFAS Estimator</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=20261019-final-audit" />
  <link rel="stylesheet" href="/site-navigation.css?v=20261107" />
  <link rel="stylesheet" href="/clinic-report.css?v=20261124" />
  <script defer src="/vendor/qrcodegen.js?v=20261124"></script>
  <script defer src="/drinking-water-records.js?v=20261124-clinic"></script>

<body class="clinic-report-page">
  <div class="report-shell">
    <div class="report-toolbar">
      <a id="reportBack" href="/">← Back to lookup</a>
      <label class="report-language"><span id="reportLanguageLabel">Language:</span>
        <select id="reportLanguage" aria-label="Report language"><option value="en">English</option><option value="zh">简体中文</option><option value="es">Español</option></select>
      </label>
      <button id="reportPrint" type="button" disabled>Print / save PDF</button>
    </div>
    <p id="reportStatus" class="report-status" role="status">Preparing your report…</p>
    <main id="clinicReport" class="clinic-report" hidden></main>
  </div>
</body>
</html>
